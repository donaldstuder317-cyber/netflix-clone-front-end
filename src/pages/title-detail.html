<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Title · Netflix Clone</title><link rel="stylesheet" href="../css/styles.css"></head>
<body><header class="header" id="nav"></header>
<main class="detail" id="main"></main>
<script type="module">
import { byId, esc, fmtRuntime, init, myList, posterCard, posterStyle, progress, renderNav, session, TITLES } from "../js/app.js";
await session.require(); renderNav("");
const main = document.getElementById("main");
const ok = await init(main);
const t = ok && byId(new URLSearchParams(location.search).get("id"));
if (ok && !t) main.innerHTML = `<div class="empty" style="margin-top:40px">Title not found.</div><p><a class="btn" href="browse.html">← Back</a></p>`;
else if (t) {
  document.title = t.title + " · Netflix Clone";
  const more = TITLES.filter(x => x.genre === t.genre && x.id !== t.id).slice(0, 3);
  const resume = progress.get(t.id) > 0;
  main.innerHTML = `<div class="backdrop" style="${posterStyle(t)}"><h1>${esc(t.title)}</h1></div>
    <div class="meta">${t.year} · ${t.rating} · ${fmtRuntime(t.runtime)} · ${t.genre}</div>
    <p>${esc(t.synopsis)}</p><p class="meta">Cast: ${t.cast.map(esc).join(", ")}</p>
    <div class="btn-row"><a class="btn" href="player.html?id=${t.id}">▶ ${resume ? "Resume" : "Play"}</a>
    <button class="btn secondary" id="list"></button></div>
    <section class="row" style="margin-top:32px"><h2>More like this</h2><div class="scroller">${more.length ? more.map(x => posterCard(x)).join("") : '<span class="meta">Nothing similar yet.</span>'}</div></section>
    <a class="btn secondary" href="javascript:history.back()">← Back</a>`;
  const b = document.getElementById("list");
  const sync = () => b.textContent = myList.has(t.id) ? "✓ Added" : "+ My List";
  b.onclick = () => { myList.toggle(t.id, sync); sync(); }; sync();
}
</script></body></html>
